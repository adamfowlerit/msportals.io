name: Validate Portal JSONs

on:
  push:
    paths:
      - '_data/portals/*.json'
      - '.github/scripts/validate_portals.py'
      - '.github/workflows/jsonValidator.yml'
  pull_request:
    paths:
      - '_data/portals/*.json'
      - '.github/scripts/validate_portals.py'
      - '.github/workflows/jsonValidator.yml'
  workflow_dispatch:

jobs:
  verify-json-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator
        run: pip install jsonschema==4.23.0

      # Checks every file in _data/portals against PortalGroup.schema.json,
      # flags URLs with stray spaces, and fails on duplicate URLs within a group.
      - name: Validate JSON
        run: python .github/scripts/validate_portals.py
