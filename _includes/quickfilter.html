<form style="margin: 0; padding: 0; display: inline">
  <label for="search" style="display: none">Quick Filter:</label>
  <input id="search" name="search" class="quickfilter" type="search" placeholder="Quick Filter" title="Press / to jump here from anywhere on the page" />
  <span id="filter-count" class="filter-count" aria-live="polite"></span>
</form>

<script type="text/javascript">
  // Search text for every portal row, built once on the first filter instead of on every keystroke
  let portalIndex = null;

  function buildPortalIndex() {
    portalIndex = Array.from(document.querySelectorAll("div.portal-group")).map((group) => ({
      group: group,
      rows: Array.from(group.querySelectorAll("div.portal")).map((row) => {
        // all text and link targets, without http(s), joined with | so words can't match across fields
        let searchableString = row.textContent.trim().replace(/\s*\n\s*/g, "|");
        searchableString += "|" + Array.from(row.getElementsByTagName("a")).map((e) => e.href).join("|");
        return {
          row: row,
          text: searchableString.replace(/(https|http):\/\//gi, "").toUpperCase(),
          b2b: row.querySelector(".btn-B2B") !== null,
        };
      }),
    }));
  }

  function showOnlyMatchedPortals() {
    if (!portalIndex) buildPortalIndex();
    const query = (this.value || "").trim();
    const textFiltering = query.length >= 2;
    // "Only B2B links" (next to the B2B Tenant ID box) keeps just the portals with a B2B button
    const b2bOnlyBox = document.getElementById("b2b_only");
    const b2bOnly = b2bOnlyBox !== null && b2bOnlyBox.checked;
    const filtering = textFiltering || b2bOnly;
    // every word must match, in any order (e.g. "entra conditional")
    const terms = textFiltering ? query.toUpperCase().split(/\s+/).filter((t) => t.length > 0) : [];
    document.body.classList.toggle("filtering", filtering);

    let matches = 0;
    let groupsShown = 0;
    portalIndex.forEach((entry) => {
      let shown = 0;
      entry.rows.forEach((r) => {
        const show = (!b2bOnly || r.b2b) && terms.every((term) => r.text.indexOf(term) !== -1);
        // only touch the page when a row actually changes
        if (r.row.hidden === show) r.row.hidden = !show;
        if (show) shown++;
      });
      const hideGroup = shown === 0;
      if (entry.group.hidden !== hideGroup) entry.group.hidden = hideGroup;
      matches += shown;
      if (!hideGroup) groupsShown++;
    });

    // Display message if no portals are found
    document.getElementsByClassName("nomatches")[0].style = groupsShown === 0 ? "display: block;" : "display: none;";

    // Show how many portals match
    const counter = document.getElementById("filter-count");
    if (counter) {
      counter.textContent = !filtering ? "" : matches === 1 ? "1 match" : matches + " matches";
    }
    document.dispatchEvent(new CustomEvent("portals-filtered"));
  }

  // Called when link targets change (B2B tenant ID): rebuild the search text and re-apply any filter
  function refreshPortalSearch(force) {
    portalIndex = null;
    const qfInput = document.querySelector("#search");
    if (qfInput && (force || qfInput.value.trim().length >= 2)) scheduleFilter.call(qfInput);
  }

  // Filter on the next screen refresh: no fixed delay, and several fast keystrokes in one frame filter once
  let filterFrame = 0;
  function scheduleFilter() {
    if (filterFrame) return;
    const input = this;
    filterFrame = requestAnimationFrame(() => {
      filterFrame = 0;
      showOnlyMatchedPortals.call(input);
    });
  }

  function idleSave() {
    var t;

    function saveSearchParamToHistory() {
      const qfInput = document.querySelector("#search");
      writeSearchToHistory.call(qfInput);
    }
    window.onload = resetIdleTimer;
    window.onmousemove = resetIdleTimer;
    window.onmousedown = resetIdleTimer; // catches touchscreen presses as well
    window.ontouchstart = resetIdleTimer; // catches touchscreen swipes as well
    window.onclick = resetIdleTimer; // catches touchpad clicks as well
    window.onkeydown = resetIdleTimer;
    window.addEventListener("scroll", resetIdleTimer, true); // improved; see comments

    function resetIdleTimer() {
      clearTimeout(t);
      t = setTimeout(saveSearchParamToHistory, 5000); // time is in milliseconds
    }
    function writeSearchToHistory() {
      let theURL = new URL(window.location.toString());
      theURL.search = window.location.search.substring(1); // copy current search-parameters without the '#' AS search-parameters
      theURL.searchParams.set("search", this.value);

      if (window.location.toString() !== theURL.href) {
        window.history.replaceState({}, "", theURL.href);
      }
    }
  }
  idleSave();

  // Run as soon as the HTML is ready, without waiting for every icon to download
  document.addEventListener("DOMContentLoaded", function () {
    // Select Search Box Element
    const qfInput = document.querySelector("#search");

    // Fill Search Box with URL Search value
    let theURL = new URL("https://dummy.com");
    // create dummy url
    theURL.search = window.location.search.substring(1);
    // copy current search-parameters without the '#' AS search-parameters
    qfInput.value = theURL.searchParams.get("search");

    // Add Event Listeners for changes (After we set the search box value)
    qfInput.addEventListener("input", scheduleFilter);
    qfInput.addEventListener("change", scheduleFilter);
    qfInput.focus({
      preventScroll: true,
    });
    // Place Cursor in the search box, ready to type

    // Create Promise to resolve after initial filtering is done
    var loadScriptAsync = function () {
      return new Promise((resolve, reject) => {
        showOnlyMatchedPortals.call(qfInput);
        resolve();
      });
    };
    var scriptLoaded = loadScriptAsync();
    scriptLoaded.then(function () {
      if (window.location.hash != "") {
        document.querySelectorAll(window.location.hash).forEach(function (anchorLink) {
          if (anchorLink.parentNode.hidden === false) {
            anchorLink.scrollIntoView({
              preventScroll: true,
              behavior: "smooth",
              block: "start",
            });
          }
        });
      }
    });
  });
</script>
